<footer class="footer">
  <div class="footer__inner">
    <div class="web-buttons">
      <a href="https://4st.li/"><img src="{{ "buttons/astro.svg" | absURL }}" width="88" height="31" alt="astro"></a>
      <a href="https://flatpak.4st.li/"><img src="{{ "buttons/linux.svg" | absURL }}" width="88" height="31" alt="Linux apps"></a>
      <img src="{{ "buttons/neko.svg" | absURL }}" width="88" height="31" alt="neko inside">
      <a href="https://gohugo.io/"><img src="{{ "buttons/hugo.svg" | absURL }}" width="88" height="31" alt="made with Hugo"></a>
      <img src="{{ "buttons/browser.svg" | absURL }}" width="88" height="31" alt="best viewed with any browser">
    </div>
    <div class="footer-fun">
      <span id="visitor-count" hidden></span>
      <button id="sound-toggle" class="footer-toggle" type="button" hidden></button>
      <button id="gold-toggle" class="footer-toggle" type="button" hidden></button>
    </div>
    <div class="copyright">
      <span>© {{ now.Year }} 4st.li</span>
    </div>
  </div>
</footer>

{{ $menu := resources.Get "js/menu.js" | js.Build }}
{{ $cp := resources.Get "js/code.js" | js.Build }}

{{ $bundle := slice $menu $cp | resources.Concat "bundle.js" | resources.Minify }}

<script type="text/javascript" src="{{ $bundle.RelPermalink }}"></script>

<!-- Extended footer section-->
{{ partial "extended_footer.html" . }}
