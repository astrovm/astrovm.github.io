<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ .Permalink }}</title>
    <link rel="canonical" href="{{ .Permalink }}" />
    {{/*
      Hugo puts a bare meta-refresh at / when defaultContentLanguageInSubdir=true.
      Production overwrites / with English HTML (CI: cp public/en → public) so
      language.js can honor preferredLanguage. This alias template mirrors that
      for local `hugo server` and any pre-copy builds.
    */}}
    <script>
      (function () {
        const dest = {{ .RelPermalink | jsonify | safeJS }};
        const path = window.location.pathname;
        const isRoot = path === "/" || path === "";

        if (!isRoot) {
          window.location.replace(dest);
          return;
        }

        // Keep in sync with assets/language.js
        const LANGUAGES = {
          supported: ["en", "es", "ja", "zh"],
          default: "en",
          cookieName: "preferredLanguage",
        };

        const cookie = document.cookie
          .split("; ")
          .find(function (row) {
            return row.startsWith(LANGUAGES.cookieName + "=");
          });
        const cookieLang = cookie && cookie.split("=")[1];
        const browserLang =
          navigator.language && navigator.language.split("-")[0];
        const lang = LANGUAGES.supported.includes(cookieLang)
          ? cookieLang
          : LANGUAGES.supported.includes(browserLang)
            ? browserLang
            : LANGUAGES.default;

        window.location.replace("/" + lang + "/");
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url={{ .RelPermalink }}" />
    </noscript>
  </head>
  <body></body>
</html>
