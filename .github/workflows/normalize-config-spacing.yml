name: Normalize config spacing

on:
  push:
    branches:
      - agent/simplify-system-configs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Normalize spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path("content").glob("configs.*.md")):
              text = path.read_text()
              text = text.replace("```\n\n\n##", "```\n\n##")
              path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/configs.*.md
          git diff --cached --check
          git commit -m "Normalize config spacing"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/normalize-config-spacing.yml
          git add .github/workflows/normalize-config-spacing.yml
          git commit -m "Remove temporary workflow"
          git push
