name: Remove page-cluster tuning

on:
  push:
    branches:
      - agent/simplify-system-configs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Remove page-cluster setting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = sorted(Path('content').glob('configs.*.md'))
          if len(paths) != 4:
              raise SystemExit(f'Expected 4 config pages, found {len(paths)}')

          line = 'vm.page-cluster = 0\n'
          for path in paths:
              text = path.read_text()
              if text.count(line) != 1:
                  raise SystemExit(f'Unexpected page-cluster line count in {path}: {text.count(line)}')
              path.write_text(text.replace(line, '', 1))
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/configs.*.md
          git diff --cached --check
          git commit -m "Remove page-cluster tuning"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/remove-page-cluster.yml
          git add .github/workflows/remove-page-cluster.yml
          git commit -m "Remove temporary workflow"
          git push
