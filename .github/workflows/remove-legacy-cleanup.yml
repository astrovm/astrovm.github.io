name: Remove legacy cleanup from configs

on:
  push:
    branches:
      - agent/simplify-system-configs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Remove migration-only cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = sorted(Path("content").glob("configs.*.md"))
          if len(paths) != 4:
              raise SystemExit(f"Expected 4 config pages, found {len(paths)}")

          line = "sudo rm -f /etc/sysctl.d/99-performance.conf /etc/sysctl.d/99-vm-zram.conf\n\n"
          for path in paths:
              text = path.read_text()
              if text.count(line) != 1:
                  raise SystemExit(f"Unexpected cleanup line count in {path}")
              path.write_text(text.replace(line, "", 1))
          PY

          git diff --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/configs.*.md
          git diff --cached --check
          git commit -m "Keep sysctl docs migration-free"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/remove-legacy-cleanup.yml
          git add .github/workflows/remove-legacy-cleanup.yml
          git commit -m "Remove temporary cleanup workflow"
          git push
