name: Refine configs

on:
  push:
    branches:
      - agent/refine-configs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply config fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = sorted(Path("content").glob("configs.*.md"))
          if len(paths) != 4:
              raise SystemExit(f"Expected 4 config pages, found {len(paths)}")

          sddm_text = {
              "configs.en.md": "KDE only. Workaround for an SDDM/GPU initialization race that can cause a black screen on boot in Kubuntu 26.04 (LP: #2063143).",
              "configs.es.md": "Solo KDE. Workaround para una condición de carrera entre SDDM y la inicialización de la GPU que puede causar una pantalla negra al bootear en Kubuntu 26.04 (LP: #2063143).",
              "configs.ja.md": "KDEのみ。Kubuntu 26.04で起動時に黒画面になる可能性があるSDDMとGPU初期化の競合に対するワークアラウンド（LP: #2063143）。",
              "configs.zh.md": "仅 KDE。用于规避 Kubuntu 26.04 中 SDDM 与 GPU 初始化竞态导致的开机黑屏问题（LP: #2063143）。",
          }

          pnpm_comment = {
              "configs.en.md": "# pnpm 11+: built-in 1-day release-age policy",
              "configs.es.md": "# pnpm 11+: política integrada de 1 día para paquetes nuevos",
              "configs.ja.md": "# pnpm 11+: 公開後1日未満のパッケージを避ける組み込みポリシー",
              "configs.zh.md": "# pnpm 11+：内置 1 天新包等待策略",
          }

          pnpm_summary = {
              "configs.en.md": "With this, npm won't run dependency `preinstall` or `postinstall` scripts. Bun blocks scripts and packages published less than 1 day ago (`86400` seconds). pnpm 11+ already applies a built-in 1-day release-age policy in non-strict mode, so no extra global setting is needed.",
              "configs.es.md": "Con esto, npm no ejecuta `preinstall` ni `postinstall` de dependencias. Bun bloquea scripts y paquetes publicados hace menos de 1 día (`86400` segundos). pnpm 11+ ya aplica una política integrada de 1 día en modo no estricto, así que no hace falta una configuración global extra.",
              "configs.ja.md": "これで npm は依存関係の `preinstall` と `postinstall` を実行しない。Bun はスクリプトと公開後1日未満のパッケージをブロックする（`86400` 秒）。pnpm 11+ は非strictモードで公開後1日の組み込みポリシーを適用するため、追加のグローバル設定は不要。",
              "configs.zh.md": "这样 npm 不会执行依赖里的 `preinstall` 和 `postinstall`。Bun 会阻止脚本和发布不到 1 天的包（`86400` 秒）。pnpm 11+ 已在非严格模式下内置 1 天发布年龄策略，不需要额外的全局设置。",
          }

          old_nm = """sudo tee /etc/NetworkManager/conf.d/99-mac-address-policy.conf > /dev/null << 'EOF'
          [device]
          wifi.scan-rand-mac-address=yes

          [connection]
          wifi.cloned-mac-address=stable
          ethernet.cloned-mac-address=preserve
          EOF"""
          new_nm = """sudo tee /etc/NetworkManager/conf.d/99-mac-address-policy.conf > /dev/null << 'EOF'
          [connection]
          wifi.cloned-mac-address=stable
          EOF"""

          old_pnpm = """eval "$(fnm env --use-on-cd --shell bash)" && \\
            fnm install --lts --use && \\
            fnm default "$(fnm current)" && \\
            corepack install --global pnpm@latest && \\
            mkdir -p ~/.local/share/pnpm && \\
            pnpm config set global-bin-dir ~/.local/share/pnpm --location=global"""
          new_pnpm = """eval "$(fnm env --use-on-cd --shell bash)" && \\
            fnm install --lts --use && \\
            fnm default "$(fnm current)" && \\
            (command -v corepack >/dev/null || npm install --global corepack@latest) && \\
            corepack enable pnpm && \\
            corepack install --global pnpm@latest && \\
            mkdir -p ~/.local/share/pnpm && \\
            pnpm config set global-bin-dir ~/.local/share/pnpm --location=global"""

          old_fd = 'ln -s "$(command -v fdfind)" ~/.local/bin/fd'
          new_fd = 'mkdir -p ~/.local/bin && \\\n  ln -sfn "$(command -v fdfind)" ~/.local/bin/fd'

          for path in paths:
              name = path.name
              text = path.read_text()

              text, count = re.subn(
                  r"(## SDDM AMDGPU\n\n)[^\n]+",
                  lambda m: m.group(1) + sddm_text[name],
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update SDDM wording in {path}")

              replacements = [
                  ("no_retry = true", "ask_retry = false", "Topgrade retry setting"),
                  (old_nm, new_nm, "NetworkManager MAC policy"),
                  (old_pnpm, new_pnpm, "Corepack/pnpm setup"),
                  (old_fd, new_fd, "fd symlink"),
              ]
              for old, new, label in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f"Expected one {label} in {path}, found {text.count(old)}")
                  text = text.replace(old, new, 1)

              text, count = re.subn(
                  r"# pnpm:[^\n]*\n"
                  r"pnpm config set minimumReleaseAge 1440 --location=global",
                  pnpm_comment[name],
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not simplify pnpm release-age config in {path}")

              summary_pattern = {
                  "configs.en.md": r"With this, npm won't run dependency `preinstall` or `postinstall` scripts\.[^\n]+",
                  "configs.es.md": r"Con esto, npm no ejecuta `preinstall` ni `postinstall` de dependencias\.[^\n]+",
                  "configs.ja.md": r"これで npm は依存関係の `preinstall` と `postinstall` を実行しない。[^\n]+",
                  "configs.zh.md": r"这样 npm 不会执行依赖里的 `preinstall` 和 `postinstall`。[^\n]+",
              }[name]
              text, count = re.subn(summary_pattern, pnpm_summary[name], text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update pnpm explanation in {path}")

              checks = [
                  "no_retry = true",
                  "wifi.scan-rand-mac-address=yes",
                  "ethernet.cloned-mac-address=preserve",
                  "pnpm config set minimumReleaseAge 1440 --location=global",
                  'ln -s "$(command -v fdfind)" ~/.local/bin/fd',
              ]
              for obsolete in checks:
                  if obsolete in text:
                      raise SystemExit(f"Obsolete content remains in {path}: {obsolete}")

              path.write_text(text)
          PY

          git diff --check
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo --minify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/configs.*.md
          git diff --cached --check
          git commit -m "Refine system configuration docs"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/refine-configs.yml
          git add .github/workflows/refine-configs.yml
          git commit -m "Remove temporary workflow"
          git push
