name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.167.0
          extended: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck and test utils (100% coverage gate)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun run typecheck
          bun run test

      - name: Build
        run: |
          hugo --minify
          # English at / for noscript; JS language.js sends / to preferred lang.
          cp -r public/en/. public/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Invalidate Cloudflare cache
        env:
          CLOUDFLARE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
        # Marks cached copies stale so the edge revalidates them against the new deploy.
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_CACHE_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"hosts":["4st.li","www.4st.li"]}' \
            "https://api.cloudflare.com/client/v4/zones/2da89ffd98b154334e04add0a5034e9b/invalidate_cache"
