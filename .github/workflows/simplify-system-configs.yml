name: Simplify system config docs

on:
  push:
    branches:
      - agent/simplify-system-configs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Simplify config pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = sorted(Path("content").glob("configs.*.md"))
          if len(paths) != 4:
              raise SystemExit(f"Expected 4 config pages, found {len(paths)}")

          empty_devices = """
          **Raspberry Pi 4 Model B**

          **Apple MacBook Air M1 2020**

          **Samsung Galaxy S22 Ultra**
          """.strip("\n")

          old_homebrew = """# homebrew
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            export HOMEBREW_PREFIX="/home/linuxbrew/.linuxbrew"
            export HOMEBREW_CELLAR="$HOMEBREW_PREFIX/Cellar"
            export HOMEBREW_REPOSITORY="$HOMEBREW_PREFIX/Homebrew"
            path_prepend "$HOMEBREW_PREFIX/bin"
            path_prepend "$HOMEBREW_PREFIX/sbin"
            [ -z "${MANPATH-}" ] || export MANPATH=":${MANPATH#:}"
            export INFOPATH="$HOMEBREW_PREFIX/share/info:${INFOPATH:-}"
          fi"""

          new_homebrew = """# homebrew
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi"""

          sysctl_pattern = re.compile(
              r"## sysctl\n\n```bash\n"
              r"sudo tee /etc/sysctl\.d/99-performance\.conf.*?"
              r"sudo sysctl --system\n```\n",
              re.DOTALL,
          )
          sysctl_replacement = """## sysctl

          ```bash
          sudo tee /etc/sysctl.d/90-zram.conf > /dev/null << 'EOF'
          vm.swappiness = 150
          vm.page-cluster = 0
          EOF

          sudo sysctl --system
          ```
          """

          bluetooth_pattern = re.compile(
              r"\n## [^\n]*(?:Bluetooth|蓝牙)[^\n]*\n\n```bash\n"
              r"sudo rfkill unblock all\n"
              r"sudo systemctl restart bluetooth\n"
              r"sudo modprobe -r btusb\n"
              r"sudo modprobe btusb\n```\n"
          )

          for path in paths:
              text = path.read_text()

              if empty_devices not in text:
                  raise SystemExit(f"Empty device block not found in {path}")
              text = text.replace(empty_devices + "\n\n", "", 1)

              text, count = sysctl_pattern.subn(sysctl_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"sysctl block not replaced in {path}")

              text, count = bluetooth_pattern.subn("\n", text, count=1)
              if count != 1:
                  raise SystemExit(f"Bluetooth block not removed in {path}")

              android_line = 'export ANDROID_SDK_ROOT="$ANDROID_HOME"\n'
              if text.count(android_line) != 1:
                  raise SystemExit(f"ANDROID_SDK_ROOT line count unexpected in {path}")
              text = text.replace(android_line, "", 1)

              if text.count(old_homebrew) != 1:
                  raise SystemExit(f"Homebrew profile block count unexpected in {path}")
              text = text.replace(old_homebrew, new_homebrew, 1)

              forbidden = [
                  "ANDROID_SDK_ROOT",
                  "99-performance.conf",
                  "vm.vfs_cache_pressure",
                  "vm.watermark_scale_factor",
                  "vm.compaction_proactiveness",
                  "sudo rfkill unblock all",
                  "**Raspberry Pi 4 Model B**",
                  "**Apple MacBook Air M1 2020**",
                  "**Samsung Galaxy S22 Ultra**",
              ]
              leftovers = [value for value in forbidden if value in text]
              if leftovers:
                  raise SystemExit(f"Unexpected leftovers in {path}: {leftovers}")

              path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/configs.*.md
          git diff --cached --check
          git commit -m "Simplify system configuration docs"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/simplify-system-configs.yml
          git add .github/workflows/simplify-system-configs.yml
          git commit -m "Remove temporary workflow"
          git push
